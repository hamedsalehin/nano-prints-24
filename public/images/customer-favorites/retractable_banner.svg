<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78" />
      <stop offset="50%" stop-color="#b020ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background grid/ambient -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  <circle cx="250" cy="250" r="220" fill="url(#shadowGrad)" opacity="0.5" />

  <g transform="translate(0, 10)">
    <!-- Supporting Pole -->
    <rect x="246" y="50" width="8" height="360" fill="url(#metalGrad)" />
    
    <!-- Banner Shadow -->
    <rect x="165" y="65" width="170" height="340" fill="black" opacity="0.1" rx="4" />

    <!-- Banner Body -->
    <rect x="160" y="60" width="180" height="345" fill="url(#bgGrad)" rx="6" />

    <!-- Abstract design lines on banner -->
    <path d="M 160 200 Q 250 150 340 250 L 340 405 L 160 405 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 160 300 Q 220 280 340 350 L 340 405 L 160 405 Z" fill="#ffffff" opacity="0.1" />
    <circle cx="300" cy="120" r="40" fill="#00e5ff" opacity="0.3" filter="url(#glow)" />
    <circle cx="200" cy="320" r="50" fill="#ff2d78" opacity="0.3" filter="url(#glow)" />

    <!-- Text content on banner -->
    <!-- Brand -->
    <text x="250" y="105" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="4">NANO PRINTS</text>
    <line x1="210" y1="115" x2="290" y2="115" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

    <!-- Main Message -->
    <text x="250" y="210" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="20" fill="#ffffff" filter="url(#glow)">RETRACTABLE</text>
    <text x="250" y="235" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="20" fill="#ffffff" filter="url(#glow)">BANNER</text>
    
    <rect x="210" y="255" width="80" height="4" fill="#00e5ff" rx="2" />

    <text x="250" y="290" text-anchor="middle" font-family="'Open Sans', sans-serif" font-weight="600" font-size="10" fill="#ffffff" opacity="0.9">PREMIUM DISPLAY</text>
    <text x="250" y="308" text-anchor="middle" font-family="'Open Sans', sans-serif" font-weight="600" font-size="10" fill="#ffffff" opacity="0.9">EASY SETUP</text>

    <!-- Bottom Metal Base -->
    <rect x="140" y="395" width="220" height="25" fill="url(#metalGrad)" rx="4" />
    <rect x="135" y="415" width="230" height="8" fill="#475569" rx="2" />
    
    <!-- Base feet -->
    <rect x="170" y="423" width="25" height="6" fill="#1e293b" />
    <rect x="305" y="423" width="25" height="6" fill="#1e293b" />
  </g>
</svg>
