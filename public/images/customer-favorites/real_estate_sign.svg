<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="signBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d78" />
      <stop offset="100%" stop-color="#b020ff" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background grid/ambient -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  <ellipse cx="250" cy="450" rx="160" ry="15" fill="url(#shadowGrad)" />

  <g transform="translate(0, 20)">
    <!-- Metal Wire Frame (H-Stake Style) -->
    <!-- Two vertical stakes -->
    <rect x="160" y="240" width="8" height="200" fill="url(#metalGrad)" rx="2" />
    <rect x="332" y="240" width="8" height="200" fill="url(#metalGrad)" rx="2" />
    <!-- Horizontal support bars -->
    <rect x="160" y="250" width="180" height="8" fill="url(#metalGrad)" rx="2" />
    <rect x="160" y="320" width="180" height="8" fill="url(#metalGrad)" rx="2" />

    <!-- Sign Board Shadow -->
    <rect x="100" y="90" width="300" height="190" rx="8" fill="none" filter="url(#shadow)" />

    <!-- Sign Board Outer Border -->
    <rect x="100" y="90" width="300" height="190" rx="8" fill="#e2e8f0" />
    <rect x="104" y="94" width="292" height="182" rx="6" fill="url(#signBgGrad)" />

    <!-- Sign Top Color Band (Header) -->
    <path d="M 104 100 Q 104 94 110 94 L 390 94 Q 396 94 396 100 L 396 144 L 104 144 Z" fill="url(#headerGrad)" />
    
    <!-- Header Text -->
    <text x="250" y="126" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="4">FOR SALE</text>

    <!-- Sign Body Content -->
    <!-- House icon or illustration in background -->
    <path d="M 130 210 L 150 190 L 170 210 L 170 230 L 130 230 Z" fill="#00e5ff" opacity="0.2" />
    <path d="M 145 230 L 145 215 L 155 215 L 155 230 Z" fill="#f8fafc" opacity="0.3" />
    
    <!-- Phone / Agency info -->
    <text x="250" y="180" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="16" fill="#1e293b" letter-spacing="1">NANO REALTY</text>
    <rect x="200" y="194" width="100" height="2" fill="#ff2d78" />

    <!-- Details -->
    <text x="250" y="222" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#00b8d4">555-0199</text>
    <text x="250" y="244" text-anchor="middle" font-family="'Open Sans', sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="0.5">VIEW BY APPOINTMENT ONLY</text>

    <!-- Riders / Extra Sign (hanging at top or bottom) - we keep it clean -->
    <circle cx="125" cy="265" r="4.5" fill="url(#metalGrad)" />
    <circle cx="375" cy="265" r="4.5" fill="url(#metalGrad)" />
  </g>
</svg>
