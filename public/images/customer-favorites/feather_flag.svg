<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#b020ff" />
      <stop offset="100%" stop-color="#ff2d78" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background grid/ambient -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  <ellipse cx="250" cy="430" rx="180" ry="25" fill="url(#shadowGrad)" />

  <g transform="translate(0, -10)">
    <!-- Base stand -->
    <path d="M 200 440 L 300 440 L 250 425 Z" fill="#475569" />
    <rect x="246" y="415" width="8" height="25" fill="url(#metalGrad)" />
    <circle cx="250" cy="415" r="7" fill="#1e293b" />

    <!-- Flagpole (bends at the top) -->
    <!-- We draw it as a bezier path -->
    <path d="M 250 415 L 250 120 Q 250 50 310 50" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

    <!-- Flag Fabric Shadow -->
    <path d="M 254 390 L 254 115 Q 254 58 308 58 Q 330 58 340 70 Q 360 100 345 150 L 300 320 Q 285 365 254 390 Z" fill="black" opacity="0.1" />

    <!-- Flag Fabric -->
    <path d="M 250 380 L 250 110 Q 250 53 304 53 Q 325 53 335 65 Q 355 95 340 145 L 295 315 Q 280 360 250 380 Z" fill="url(#flagGrad)" />

    <!-- Abstract White swooshes on Flag -->
    <path d="M 250 220 Q 290 200 325 240 L 315 280 Q 280 230 250 255 Z" fill="#ffffff" opacity="0.18" />
    <path d="M 250 120 Q 290 110 320 140 L 315 170 Q 280 130 250 150 Z" fill="#ffffff" opacity="0.12" />

    <!-- Text rotated to follow the flag profile -->
    <!-- We can use vertical writing, or a transform rotate, or standard text. Let's do a beautiful vertical text layout. -->
    <g transform="translate(285, 205) rotate(-72)">
      <text x="0" y="0" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="4" filter="url(#glow)">FEATHER</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="4" filter="url(#glow)">FLAG</text>
    </g>

    <!-- Small details -->
    <circle cx="295" cy="85" r="4" fill="#ffffff" opacity="0.5" />
    <circle cx="270" cy="340" r="6" fill="#00e5ff" opacity="0.4" filter="url(#glow)" />
  </g>
</svg>
